[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "documind-ai"
version = "1.0.0"
description = "🧠 AI-powered document conversion and knowledge extraction tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "DocuMind AI Team", email = "team@documind.ai"}
]
keywords = ["ai", "document", "markdown", "conversion", "knowledge-extraction", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "python-magic>=0.4.27",
    "markdownify>=0.11.6",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "python-pptx>=0.6.21",
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
    "tenacity>=8.2.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]

[project.scripts]
documind = "documind_ai.cli:main"
dm = "documind_ai.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/documind-ai"
Documentation = "https://github.com/yourusername/documind-ai#readme"
Repository = "https://github.com/yourusername/documind-ai"
Issues = "https://github.com/yourusername/documind-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/documind_ai"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
